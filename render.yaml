services:
  - type: web
    name: go-helloworld
    env: docker
    dockerfilePath: ./Dockerfile
    # 资源规格：免费档
    plan: free
    # 环境变量，代码读取 PORT
    envVars:
      - key: PORT
        value: 8080
    # 健康检查（可选）
    healthCheckPath: /healthz
    # 自动休眠：free套餐默认开启，15分钟无流量休眠，无法关闭
    autoDeploy: true
