name: helloworld release archive

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package source archive
        run: bash scripts/package-hello.sh "dist/helloworld-${{ github.event.release.tag_name }}.tar.gz"

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "dist/helloworld-$TAG.tar.gz" --clobber
